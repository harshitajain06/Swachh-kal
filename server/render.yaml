# One-click host on Render.com: New + > Blueprint > point at this repo.
services:
  - type: web
    name: swachh-kal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
